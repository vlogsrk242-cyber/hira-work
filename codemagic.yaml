workflows:
  android-release:
    name: Hira Work Sheth APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          cd sheth_app

          flutter create \
            --platforms=android \
            --org com.hirawork \
            --project-name hira_work_sheth \
            .

          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings_file = Path("android/settings.gradle.kts")
          text = settings_file.read_text()

          marker = 'id("com.android.application") version'
          plugin_line = '    id("com.google.gms.google-services") version "4.5.0" apply false\n'

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  marker,
                  plugin_line + '    ' + marker
              )

          settings_file.write_text(text)

          app_file = Path("android/app/build.gradle.kts")
          text = app_file.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services")'
              )

          app_file.write_text(text)
          PY

      - name: Get Flutter packages
        script: |
          cd sheth_app
          flutter pub get

      - name: Check Firebase configuration
        script: |
          cd sheth_app

          echo "Checking google-services.json..."

          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration file found."

          python3 - <<'PY'
          import json

          with open("google-services.json", "r") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id", "")
          print("Firebase Project ID:", project_id)

          for client in data.get("client", []):
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name", "")
              )
              print("Firebase Android Package:", package_name)
          PY

      - name: Get SHA-1
        script: |
          cd sheth_app
          flutter build apk --debug

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep "SHA1:"

      - name: Build Android APK
        script: |
          cd sheth_app
          flutter build apk --release

    artifacts:
      - sheth_app/build/app/outputs/flutter-apk/app-release.apk
