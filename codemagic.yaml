workflows:
  android-release:
    name: Hira Work Sheth APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - firebase_credentials

    scripts:
      - name: Generate Android project
        script: |
          cd sheth_app
          flutter create --platforms=android .

          echo "$ANDROID_FIREBASE_JSON" | base64 --decode > android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          build_file = Path("android/app/build.gradle.kts")
          text = build_file.read_text()

          text = text.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services")'
          )

          build_file.write_text(text)

          settings_file = Path("android/settings.gradle.kts")
          text = settings_file.read_text()

          text = text.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false'
          )

          settings_file.write_text(text)
          PY

      - name: Get Flutter packages
        script: |
          cd sheth_app
          flutter pub get

      - name: Build Android APK
        script: |
          cd sheth_app
          flutter build apk --release

    artifacts:
      - sheth_app/build/app/outputs/flutter-apk/app-release.apk
